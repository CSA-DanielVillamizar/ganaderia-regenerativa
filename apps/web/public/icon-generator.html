<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Generador de Iconos - Ganadería Voisin</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #f5f5f5;
        color: #0f172a;
        padding: 24px;
      }
      .card {
        max-width: 640px;
        margin: 0 auto;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      }
      canvas {
        display: none;
      }
      button {
        padding: 12px 18px;
        border-radius: 10px;
        border: none;
        background: #166534;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Generador de Iconos PWA - Ganadería Voisin</h1>
      <p>
        Abre este archivo en tu navegador para descargar los iconos, luego muévelos a la carpeta
        <code>/icons/</code>.
      </p>
      <p>Los archivos <code>icon-192x192.png</code> y <code>icon-512x512.png</code> se descargarán automáticamente.</p>
      <button onclick="generateIcons()">Generar nuevamente</button>
    </div>

    <canvas id="canvas" width="512" height="512"></canvas>

    <script>
      function drawLogo(size) {
        const canvas = document.getElementById('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        // Fondo verde (escudo)
        ctx.fillStyle = '#166534';
        ctx.beginPath();
        ctx.moveTo(size * 0.2, size * 0.1);
        ctx.lineTo(size * 0.8, size * 0.1);
        ctx.lineTo(size * 0.9, size * 0.4);
        ctx.lineTo(size * 0.5, size * 0.9);
        ctx.lineTo(size * 0.1, size * 0.4);
        ctx.closePath();
        ctx.fill();

        // Hoja blanca
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(size * 0.5, size * 0.25);
        ctx.bezierCurveTo(size * 0.65, size * 0.35, size * 0.65, size * 0.6, size * 0.5, size * 0.7);
        ctx.bezierCurveTo(size * 0.35, size * 0.6, size * 0.35, size * 0.35, size * 0.5, size * 0.25);
        ctx.fill();

        // Nervadura
        ctx.strokeStyle = '#166534';
        ctx.lineWidth = size * 0.02;
        ctx.beginPath();
        ctx.moveTo(size * 0.5, size * 0.28);
        ctx.lineTo(size * 0.5, size * 0.68);
        ctx.stroke();
      }

      function download(size) {
        drawLogo(size);
        const link = document.createElement('a');
        link.download = `icon-${size}x${size}.png`;
        link.href = document.getElementById('canvas').toDataURL('image/png');
        link.click();
      }

      function generateIcons() {
        [192, 512].forEach(download);
      }

      window.addEventListener('load', generateIcons);
    </script>
  </body>
</html>
