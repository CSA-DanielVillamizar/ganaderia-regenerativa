name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ganaderia
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: ganaderia_dev
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run build --workspace=@ganaderia/api

      - name: Build API
        run: npm run build --workspace=@ganaderia/api
        env:
          DATABASE_URL: postgresql://ganaderia:password123@localhost:5432/ganaderia_dev

      - name: Build Web
        run: npm run build --workspace=@ganaderia/web

      - name: Run Tests
        run: npm run test --workspace=@ganaderia/api --workspace=@ganaderia/web
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://ganaderia:password123@localhost:5432/ganaderia_dev
